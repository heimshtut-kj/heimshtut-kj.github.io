name: One-time publish 0608 Toldos
on:
  workflow_dispatch:
    inputs:
      phase:
        description: build (issue folder only) or home (update home, archive, sitemap)
        required: true
        default: build
permissions:
  contents: write
  pages: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build issue folder
        if: ${{ inputs.phase == 'build' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ghostscript python3-pil
          curl -fL -o /tmp/issue.pdf 'https://drive.usercontent.google.com/download?id=1IwFkaLEZ1nQhhrZ5zJ0_01N4Jbg_veLU&export=download&confirm=t'
          ls -l /tmp/issue.pdf
          test "$(stat -c %s /tmp/issue.pdf)" = 161647783
          pdfinfo /tmp/issue.pdf | grep -E 'Pages:|Page size:'
          test "$(pdfinfo /tmp/issue.pdf | awk '/^Pages:/{print $2}')" = 84
          O=issues/0608-toldos
          mkdir -p $O/z
          cat > /tmp/render.py <<'PY'
          import subprocess, sys, io
          from PIL import Image
          Image.MAX_IMAGE_PIXELS=None
          p=int(sys.argv[1]); out='issues/0608-toldos'
          raw=subprocess.run(['pdftoppm','-f',str(p),'-l',str(p),'-scale-to-x','2585','-scale-to-y','3200','-png','/tmp/issue.pdf'],capture_output=True,check=True).stdout
          im=Image.open(io.BytesIO(raw)).convert('RGB')
          n='%03d'%p
          im.save(f'{out}/z/p{n}.webp','WEBP',quality=80,method=4)
          im.resize((1293,1600),Image.LANCZOS).save(f'{out}/p{n}.jpg','JPEG',quality=80)
          if p==1:
              im.resize((800,991),Image.LANCZOS).save(f'{out}/cover.jpg','JPEG',quality=82)
              im.resize((400,496),Image.LANCZOS).save(f'{out}/thumb.jpg','JPEG',quality=80)
          PY
          seq 1 84 | xargs -P 4 -I{} python3 /tmp/render.py {}
          gs -q -dNOPAUSE -dBATCH -sDEVICE=pdfwrite -dCompatibilityLevel=1.6 -dDownsampleColorImages=true -dColorImageResolution=200 -dColorImageDownsampleThreshold=1.0 -dDownsampleGrayImages=true -dGrayImageResolution=200 -dAutoFilterColorImages=false -dColorImageFilter=/DCTEncode -dJPEGQ=85 -dDetectDuplicateImages=true -sOutputFile=$O/heimshtut-0608-toldos.pdf /tmp/issue.pdf
          echo '' | base64 -d > $O/index.html
          test "$(ls $O/p*.jpg | wc -l)" = 84
          test "$(ls $O/z/p*.webp | wc -l)" = 84
          test "$(pdfinfo $O/heimshtut-0608-toldos.pdf | awk '/^Pages:/{print $2}')" = 84
          test "$(stat -c %s $O/heimshtut-0608-toldos.pdf)" -lt 95000000
          du -sh $O $O/heimshtut-0608-toldos.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $O
          git commit -m 'Add issue 0608 Toldos (pages, zoom, PDF)'
          git push
      - name: Update home, archive and sitemap
        if: ${{ inputs.phase == 'home' }}
        run: |
          set -euo pipefail
          test -f issues/0608-toldos/index.html
          test "$(ls issues/0608-toldos/p*.jpg | wc -l)" = 84
          echo '' | base64 -d > /tmp/home.patch
          patch -p1 --dry-run < /tmp/home.patch
          patch -p1 < /tmp/home.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sitemap.xml archive/index.html
          git commit -m 'Show 0608 Toldos as latest issue; move 0607 to archive'
          git push
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
